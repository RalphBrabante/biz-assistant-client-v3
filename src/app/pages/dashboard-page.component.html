<section class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h4 mb-1">Dashboard</h1>
        <p class="text-secondary mb-0">System status and quick API workspace overview.</p>
      </div>
      <button class="btn btn-outline-primary" (click)="refresh()" [disabled]="loading">
        {{ loading ? 'Refreshing...' : 'Refresh' }}
      </button>
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <pre *ngIf="health" class="bg-body-tertiary rounded-3 p-3 mb-0 small">{{ health | json }}</pre>
  </div>
</section>
