<section class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
  <div class="card-body p-4 p-lg-5 role-hero">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <div class="text-uppercase small fw-semibold text-secondary mb-2">Subscriptions</div>
        <h1 class="h3 mb-2">Edit License</h1>
        <p class="text-secondary mb-0">Update assignment and subscription details. License key is immutable.</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-dark" routerLink="/licenses"><i class="bi bi-arrow-left me-1"></i>Back to Licenses</a>
      </div>
    </div>
  </div>
</section>

<div *ngIf="message()" class="alert alert-success">{{ message() }}</div>
<div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

<section class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <div *ngIf="loading()" class="text-secondary">Loading license...</div>

    <div class="row g-3" *ngIf="!loading() && license()">
      <div class="col-12 col-md-6">
        <label class="form-label">Assign Organization</label>
        <select class="form-select" [(ngModel)]="form['organizationId']">
          <option value="">Unassigned</option>
          <option *ngFor="let org of organizations()" [value]="org.id">{{ organizationOptionLabel(org) }}</option>
        </select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">License Key</label>
        <input class="form-control" [ngModel]="form['key']" readonly />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Plan</label>
        <input class="form-control" [(ngModel)]="form['planName']" />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Status</label>
        <input class="form-control" [(ngModel)]="form['status']" />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Max Users</label>
        <input type="number" class="form-control" [(ngModel)]="form['maxUsers']" />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Starts At</label>
        <input type="datetime-local" class="form-control" [(ngModel)]="form['startsAt']" />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Expires At</label>
        <input type="datetime-local" class="form-control" [(ngModel)]="form['expiresAt']" />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Revoked At</label>
        <input type="datetime-local" class="form-control" [ngModel]="form['revokedAt']" readonly />
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea rows="2" class="form-control" [(ngModel)]="form['notes']"></textarea>
      </div>
      <div class="col-12 col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="form['isActive']" />
          <label class="form-check-label">Active</label>
        </div>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" [disabled]="submitting()" (click)="save()">
          {{ submitting() ? 'Saving...' : 'Save License' }}
        </button>
        <button
          class="btn btn-outline-danger"
          type="button"
          [disabled]="submitting() || form['status'] === 'revoked'"
          (click)="revoke()"
        >
          <i class="bi bi-slash-circle me-1"></i>Revoke License
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="backToList()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</section>
