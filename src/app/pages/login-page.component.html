<main class="auth-bg min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6 col-xl-5">
        <section class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="px-4 py-3 hero-strip d-flex justify-content-between align-items-center">
            <strong>GIMO Assistant</strong>
            <span class="badge text-bg-light">API Workspace</span>
          </div>

          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Sign in</h1>
            <p class="text-secondary mb-4">Use your seeded credentials to access all API pages.</p>

            <form (ngSubmit)="submit()" #f="ngForm">
              <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="form-control form-control-lg"
                  [(ngModel)]="email"
                  required
                  autocomplete="username"
                />
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control form-control-lg"
                  [(ngModel)]="password"
                  required
                  autocomplete="current-password"
                />
              </div>

              <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading || !f.form.valid">
                  {{ loading ? 'Signing in...' : 'Sign In' }}
                </button>
              </div>
            </form>

            <div *ngIf="error" class="alert alert-danger mt-4 mb-0" role="alert">
              {{ error }}
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
