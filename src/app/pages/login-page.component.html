<main class="auth-bg min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6 col-xl-5">
        <section class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="px-4 py-3 hero-strip d-flex justify-content-between align-items-center">
            <strong>Biz Assistant</strong>
            <div class="d-flex align-items-center gap-2">
              <button
                type="button"
                class="btn btn-sm btn-outline-light"
                (click)="toggleTheme()"
                [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
              >
                <i class="bi" [class.bi-moon-stars]="!theme.isDark()" [class.bi-sun]="theme.isDark()"></i>
              </button>
              <span class="badge text-bg-light">Biz Workspace</span>
            </div>
          </div>

          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Sign in</h1>
            <p class="text-secondary mb-4">Sign in using your account credentials.</p>

            <form (ngSubmit)="submit()" #f="ngForm">
              <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="form-control form-control-lg"
                  [(ngModel)]="email"
                  required
                  autocomplete="username"
                />
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control form-control-lg"
                  [(ngModel)]="password"
                  required
                  autocomplete="current-password"
                />
                <div class="d-flex justify-content-end mt-2">
                  <button class="btn btn-link btn-sm text-decoration-none px-0" type="button" (click)="openForgotModal()">
                    Forgot password?
                  </button>
                </div>
              </div>

              <div class="d-grid">
                <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading || !f.form.valid">
                  {{ loading ? 'Signing in...' : 'Sign In' }}
                </button>
              </div>
            </form>

            <div *ngIf="error" class="alert alert-danger mt-4 mb-0" role="alert">
              <div>{{ error }}</div>
              <div class="mt-2" *ngIf="canResendVerification">
                <button class="btn btn-outline-danger btn-sm" type="button" (click)="resendVerificationEmail()" [disabled]="verificationLoading">
                  {{ verificationLoading ? 'Sending verification...' : 'Send verification email' }}
                </button>
              </div>
            </div>
            <div *ngIf="verificationMessage" class="alert alert-info mt-3 mb-0" role="alert">
              {{ verificationMessage }}
            </div>

            <div class="text-center mt-3">
              <a class="small text-decoration-none" routerLink="/reset-password">Have a reset token already?</a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>

<div class="modal-backdrop fade show" *ngIf="forgotModalVisible"></div>
<div
  class="modal fade show"
  tabindex="-1"
  [style.display]="forgotModalVisible ? 'block' : 'none'"
  [attr.aria-hidden]="!forgotModalVisible"
  *ngIf="forgotModalVisible"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title">
          <i class="bi bi-envelope-paper-heart me-2 text-primary"></i>
          Reset Password
        </h5>
        <button type="button" class="btn-close" (click)="closeForgotModal()"></button>
      </div>
      <div class="modal-body">
        <p class="text-secondary mb-3">
          Enter your account email and we will send a secure reset link.
        </p>
        <label class="form-label fw-semibold" for="forgotEmail">Email</label>
        <input
          id="forgotEmail"
          type="email"
          class="form-control"
          [(ngModel)]="forgotEmail"
          [disabled]="forgotLoading"
          autocomplete="email"
        />
        <div *ngIf="forgotMessage" class="alert alert-success mt-3 mb-0">
          {{ forgotMessage }}
        </div>
        <div *ngIf="forgotError" class="alert alert-danger mt-3 mb-0">
          {{ forgotError }}
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-outline-secondary" type="button" (click)="closeForgotModal()" [disabled]="forgotLoading">
          Close
        </button>
        <button class="btn btn-primary" type="button" (click)="submitForgotPassword()" [disabled]="forgotLoading">
          {{ forgotLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </div>
    </div>
  </div>
</div>
