<main class="auth-bg min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6 col-xl-5">
        <section class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="px-4 py-3 hero-strip d-flex justify-content-between align-items-center">
            <strong>Biz Assistant</strong>
            <button
              type="button"
              class="btn btn-sm btn-outline-light"
              (click)="toggleTheme()"
              [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
            >
              <i class="bi" [class.bi-moon-stars]="!theme.isDark()" [class.bi-sun]="theme.isDark()"></i>
            </button>
          </div>

          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Reset password</h1>
            <p class="text-secondary mb-4">
              Enter your reset token and your new password.
            </p>

            <form (ngSubmit)="submit()" #f="ngForm">
              <div class="mb-3">
                <label class="form-label fw-semibold" for="token">Reset Token</label>
                <input
                  id="token"
                  name="token"
                  type="text"
                  class="form-control"
                  [(ngModel)]="token"
                  required
                  [readonly]="loading"
                  autocomplete="off"
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold" for="newPassword">New Password</label>
                <input
                  id="newPassword"
                  name="newPassword"
                  type="password"
                  class="form-control"
                  [(ngModel)]="newPassword"
                  required
                  minlength="8"
                  [readonly]="loading"
                  autocomplete="new-password"
                />
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold" for="confirmPassword">Confirm Password</label>
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  class="form-control"
                  [(ngModel)]="confirmPassword"
                  required
                  minlength="8"
                  [readonly]="loading"
                  autocomplete="new-password"
                />
              </div>

              <div class="d-grid mb-3">
                <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading || !f.form.valid">
                  {{ loading ? 'Updating...' : 'Reset Password' }}
                </button>
              </div>

              <div class="text-center">
                <a routerLink="/login" class="small text-decoration-none">Back to Login</a>
              </div>
            </form>

            <div *ngIf="error" class="alert alert-danger mt-4 mb-0">
              {{ error }}
            </div>
            <div *ngIf="success" class="alert alert-success mt-4 mb-0">
              <div>{{ success }}</div>
              <button class="btn btn-success btn-sm mt-2" type="button" (click)="goToLogin()">
                Go to Login
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
