<section class="card border-0 shadow-sm rounded-4 mb-4">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">{{ config.title }}</h1>

    <div *ngIf="message" class="alert alert-success">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <form (ngSubmit)="submit()" class="row g-3">
      <div class="col-12 col-md-6" *ngFor="let field of config.fields">
        <div class="form-check mt-4" *ngIf="isCheckbox(field)">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="field.key"
            [name]="field.key"
            [(ngModel)]="form[field.key]"
          />
          <label class="form-check-label" [for]="field.key">{{ field.label }}</label>
        </div>

        <ng-container *ngIf="!isCheckbox(field)">
          <label class="form-label fw-semibold" [for]="field.key">{{ field.label }}</label>

          <textarea
            *ngIf="isTextArea(field) || isJson(field)"
            class="form-control"
            rows="3"
            [id]="field.key"
            [name]="field.key"
            [required]="!!field.required"
            [placeholder]="field.placeholder || ''"
            [(ngModel)]="form[field.key]"
          ></textarea>

          <input
            *ngIf="!isTextArea(field) && !isJson(field)"
            class="form-control"
            [type]="inputType(field)"
            [id]="field.key"
            [name]="field.key"
            [required]="!!field.required"
            [readonly]="!!editingId && field.readonlyOnEdit"
            [placeholder]="field.placeholder || ''"
            [(ngModel)]="form[field.key]"
          />
        </ng-container>
      </div>

      <div class="col-12 d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" type="submit" [disabled]="submitting">
          <i class="bi bi-plus-lg me-1" *ngIf="!editingId"></i>
          <i class="bi bi-floppy2 me-1" *ngIf="editingId"></i>
          {{ submitting ? 'Saving...' : (editingId ? 'Update' : 'Create') }}
        </button>
        <button *ngIf="editingId" class="btn btn-outline-secondary" type="button" (click)="cancelEdit()">
          <i class="bi bi-x-lg me-1"></i>
          Cancel Edit
        </button>
        <button class="btn btn-outline-dark" type="button" (click)="load()" [disabled]="loading">
          <i class="bi bi-arrow-clockwise me-1"></i>
          {{ loading ? 'Refreshing...' : 'Refresh List' }}
        </button>
      </div>
    </form>
  </div>
</section>

<section class="card border-0 shadow-sm rounded-4">
  <div class="card-body border-bottom">
    <div class="row g-3">
      <div class="col-12 col-md-8">
        <label class="form-label">Search</label>
        <input
          type="text"
          class="form-control"
          placeholder="Search table records..."
          [(ngModel)]="searchQuery"
          name="resourceSearch"
        />
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Active Filter</label>
        <select class="form-select" [(ngModel)]="activeFilter" name="resourceActiveFilter">
          <option value="">All</option>
          <option value="active">Active Only</option>
          <option value="inactive">Inactive Only</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <div class="btn-group w-100 view-toggle-group" role="group" aria-label="Toggle table or card view">
          <button class="btn btn-outline-secondary" type="button" [class.active]="viewMode === 'table'" (click)="setViewMode('table')" title="Table view" aria-label="Table view">
            <i class="bi bi-table"></i>
          </button>
          <button class="btn btn-outline-secondary" type="button" [class.active]="viewMode === 'card'" (click)="setViewMode('card')" title="Card view" aria-label="Card view">
            <i class="bi bi-grid-3x2-gap"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive table-view-wrapper" [ngClass]="{ 'table-card-view': viewMode === 'card' }">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th *ngFor="let key of config.summaryFields">{{ key }}</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="!loading && filteredRows.length === 0">
            <td [attr.colspan]="config.summaryFields.length + 2" class="text-center text-secondary py-4">
              No records found.
            </td>
          </tr>
          <tr *ngFor="let row of filteredRows; trackBy: trackById">
            <td class="text-nowrap small">{{ row['id'] }}</td>
            <td *ngFor="let key of config.summaryFields">{{ prettyValue(row, key) }}</td>
            <td class="text-end text-nowrap">
              <div class="table-actions-inline">
                <button class="btn btn-sm btn-outline-secondary" type="button" (click)="edit(row)" appTooltip title="Edit">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-danger"
                  type="button"
                  [disabled]="deletingId === row['id']"
                  (click)="remove(row['id'])"
                  appTooltip
                  title="Delete"
                >
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
