<section class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
  <div class="card-body p-4 p-lg-5 role-hero">
    <div>
      <div class="text-uppercase small fw-semibold text-secondary mb-2">Platform</div>
      <h1 class="h3 mb-2">Settings</h1>
      <p class="text-secondary mb-0">Superuser controls for platform-wide behavior.</p>
    </div>
  </div>
</section>

<section class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <div *ngIf="message()" class="alert alert-success">{{ message() }}</div>
    <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

    <div *ngIf="isSuperuser; else notAllowed">
      <div class="form-check form-switch mb-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="cacheEnabled"
          [checked]="cacheEnabled()"
          (change)="cacheEnabled.set($any($event.target).checked)"
        />
        <label class="form-check-label fw-semibold" for="cacheEnabled">
          Enable Redis Read Cache
        </label>
      </div>

      <p class="text-secondary small mb-4">
        Applies to API read endpoints. Write operations clear cache automatically.
      </p>

      <button class="btn btn-primary" [disabled]="submitting() || loading()" (click)="save()">
        {{ submitting() ? 'Saving...' : 'Save Settings' }}
      </button>
    </div>

    <ng-template #notAllowed>
      <div class="text-secondary">Only superuser can access this page.</div>
    </ng-template>
  </div>
</section>
