<main class="auth-bg min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6 col-xl-5">
        <section class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="px-4 py-3 hero-strip d-flex justify-content-between align-items-center">
            <strong>Biz Assistant</strong>
            <button
              type="button"
              class="btn btn-sm btn-outline-light"
              (click)="toggleTheme()"
              [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
            >
              <i class="bi" [class.bi-moon-stars]="!theme.isDark()" [class.bi-sun]="theme.isDark()"></i>
            </button>
          </div>

          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Verify email</h1>
            <p class="text-secondary mb-4">Confirm your account to continue.</p>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="token">Verification Token</label>
              <input
                id="token"
                type="text"
                class="form-control"
                [(ngModel)]="token"
                [readonly]="loading"
              />
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary" type="button" (click)="verify()" [disabled]="loading || !token">
                {{ loading ? 'Verifying...' : 'Verify Email' }}
              </button>
              <a routerLink="/login" class="btn btn-outline-secondary">Back to Login</a>
            </div>

            <div *ngIf="error" class="alert alert-danger mt-4 mb-0">{{ error }}</div>
            <div *ngIf="success" class="alert alert-success mt-4 mb-0">
              <div>{{ success }}</div>
              <button class="btn btn-success btn-sm mt-2" type="button" (click)="goToLogin()">
                Go to Login
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
